# OpenSinop self-hosted Docker Compose setup
# One-line start (after creating this file): docker compose up -d
# Or directly from GitHub:
# docker compose -f https://raw.githubusercontent.com/koamishin/OpenSinop/main/docker-compose.yml up -d

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: ghcr.io/koamishin/opensinop:${EDUFLOW_VERSION:-latest}
        container_name: opensinop
        restart: unless-stopped
        ports:
            - '${APP_PORT:-8000}:8000'
        env_file:
            - path: .env
              required: false
        environment:
            APP_NAME: ${APP_NAME:-OpenSinop}
            APP_ENV: ${APP_ENV:-production}
            APP_KEY: ${APP_KEY:-}
            APP_DEBUG: ${APP_DEBUG:-false}
            APP_URL: ${APP_URL:-http://localhost:8000}
            DB_CONNECTION: ${DB_CONNECTION:-pgsql}
            DB_HOST: ${DB_HOST:-db}
            DB_PORT: ${DB_PORT:-5432}
            DB_DATABASE: ${DB_DATABASE:-opensinop}
            DB_USERNAME: ${DB_USERNAME:-opensinop}
            DB_PASSWORD: ${DB_PASSWORD:-opensinop}
            REDIS_HOST: ${REDIS_HOST:-redis}
            REDIS_PORT: ${REDIS_PORT:-6379}
            CACHE_STORE: ${CACHE_STORE:-redis}
            SESSION_DRIVER: ${SESSION_DRIVER:-database}
            QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
            EDUFLOW_INSTITUTION: ${EDUFLOW_INSTITUTION:-My School}
            EDUFLOW_COUNTRY: ${EDUFLOW_COUNTRY:-US}
            EDUFLOW_TIMEZONE: ${EDUFLOW_TIMEZONE:-UTC}
            EDUFLOW_CURRENCY: ${EDUFLOW_CURRENCY:-USD}
        volumes:
            - opensinop_storage:/app/storage
            - opensinop_cache:/app/bootstrap/cache
        # Availability boundary for the PHP worker. docker/php.ini sets
        # memory_limit = -1 to remove the attacker-triggerable per-request OOM
        # that CVE-2026-109618 abuses, so the container limit is what keeps a
        # runaway request from taking down the host. The kernel OOM killer
        # targets the worker; supervisor restarts it.
        mem_limit: ${APP_MEMORY_LIMIT:-2g}
        depends_on:
            db:
                condition: service_healthy
                required: false
        healthcheck:
            test: ['CMD-SHELL', 'healthcheck']
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 60s

    db:
        image: postgres:16-alpine
        container_name: opensinop-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-opensinop}
            POSTGRES_USER: ${POSTGRES_USER:-${DB_USERNAME:-opensinop}}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-opensinop}}
        volumes:
            - opensinop_db:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U $${POSTGRES_USER:-$${DB_USERNAME:-opensinop}} -d $${POSTGRES_DB:-opensinop}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        container_name: opensinop-redis
        restart: unless-stopped
        volumes:
            - opensinop_redis:/data

volumes:
    opensinop_storage:
    opensinop_cache:
    opensinop_db:
    opensinop_redis:
