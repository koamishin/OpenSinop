name: Docs

# Publishes the Astro + Starlight documentation site in docs/ to GitHub Pages.
#
# - Every pull request that touches the documentation is built and link-checked.
# - A push to main that touches docs/** (content, config, styles, scripts or this
#   workflow) rebuilds and publishes the site.
# - workflow_dispatch republishes on demand from main, e.g. after a Pages outage
#   or a settings change. It is deliberately ignored on any other branch so a
#   feature branch can never replace the published documentation.
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Serialise documentation runs per ref. Deployments are never cancelled midway:
# an interrupted publish would leave the site in a partial state.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Pinned to the 2026-10-21 security release (see ci.yml).
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test documentation checks
        run: npm run test

      - name: Build documentation site
        run: npm run build

      # Fails the build if an in-content link escapes the configured base, points
      # at a missing page, or names an anchor that does not exist.
      - name: Check internal links
        run: npm run check:links

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Main only. A pull request (validation build) or a dispatch from any other
    # branch must never replace the published documentation.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report published URL
        run: echo "Documentation published at ${{ steps.deployment.outputs.page_url }}"
