[PHP]
; Request size limits are deliberately far below what PHP would accept.
; The application's own validation caps uploads at 10 MB (see
; app/Actions/CaptureCollectionBatch.php), so these bounds reject oversized
; bodies before PHP allocates memory for them.
;
; A low post_max_size is the primary defence against CVE-2026-109618: the
; exploit needs an attacker-controlled out-of-memory condition, and a bounded
; request body makes triggering one expensive and unreliable.
post_max_size = 32M
upload_max_filesize = 16M
expose_php = 0
realpath_cache_size = 32M
realpath_cache_ttl = 720
; memory_limit = -1 removes the predictable, attacker-triggerable per-request
; limit that CVE-2026-109618 abuses. Availability is instead bounded by the
; container memory limit (see mem_limit in docker-compose.yml and
; --limit-memory in install.sh), which kills only the offending worker.
memory_limit = -1
max_input_time = 5
; Bound the size and shape of parsed input so a single request cannot exhaust
; the worker's heap.
max_input_vars = 1000
max_input_nesting_level = 16
register_argc_argv = 0
date.timezone = ${TZ:-UTC}

[Session]
; Session upload progress keeps per-request state alive in the worker between
; requests, which is the producer side of the CVE-2026-109619 stale global
; state use-after-free. The application does not use upload progress.
session.upload_progress.enabled = 0

[Opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.use_cwd = 0
opcache.save_comments = 1
opcache.max_file_size = 0
opcache.max_accelerated_files = 32531
opcache.validate_timestamps = 0
opcache.file_update_protection = 0
opcache.interned_strings_buffer = 16
opcache.enable_file_override = 1
opcache.file_cache_consistency_checks = 0
opcache.file_cache = /tmp/opcache-file-cache
opcache.file_cache_ttl = 3600

[JIT]
opcache.jit_buffer_size = 128M
opcache.jit = tracing
opcache.jit_hot_loop = 16
opcache.jit_hot_func = 32
opcache.jit_hot_return = 4
opcache.jit_max_root_traces = 2048
opcache.jit_max_side_traces = 256
